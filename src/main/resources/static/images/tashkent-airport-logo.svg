<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <!-- Text: TASHKENT (Golden Ochre / Aviation Gold) -->
  <text x="8" y="28" fill="#C49A2B" font-family="'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" letter-spacing="2">TASHKENT</text>
  
  <!-- Text: Airport (Aviation Slate Navy) -->
  <text x="8" y="56" fill="#0F2B5C" font-family="'Montserrat', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Airport</text>
  
  <!-- Emblem on Right (Gold Uzbek Girih Medallion + Ascending Aircraft) -->
  <g transform="translate(196, 32)">
    <!-- Medallion Outer Gold Border -->
    <circle cx="0" cy="0" r="28" stroke="#C49A2B" stroke-width="2.2" fill="#FFFDF8"/>
    <circle cx="0" cy="0" r="20" stroke="#C49A2B" stroke-width="1.6" fill="none"/>
    
    <!-- 8 Interconnected Ornamental Girih Petals -->
    <path d="M0 -28 C 11 -22, 18 -13, 20 0 C 18 13, 11 22, 0 28 C -11 22, -18 13, -20 0 C -18 -13, -11 -22, 0 -28" stroke="#C49A2B" stroke-width="1.8" fill="none"/>
    <path d="M-28 0 C -22 11, -13 18, 0 20 C 13 18, 22 11, 28 0 C 22 -11, 13 -18, 0 -20 C -13 -18, -22 -11, -28 0" stroke="#C49A2B" stroke-width="1.8" fill="none"/>
    <path d="M-19.8 -19.8 C -7 -22, 4 -18, 14 -14 C 18 -4, 22 7, 19.8 19.8 C 7 22, -4 18, -14 14 C -18 4, -22 -7, -19.8 -19.8" stroke="#C49A2B" stroke-width="1.5" fill="none"/>
    <path d="M19.8 -19.8 C 22 -7, 18 4, 14 14 C 4 18, -7 22, -19.8 19.8 C -22 7, -18 -4, -14 -14 C -4 -18, 7 -22, 19.8 -19.8" stroke="#C49A2B" stroke-width="1.5" fill="none"/>

    <!-- Central Airplane Silhouette flying diagonally up-right (45 deg) -->
    <g transform="rotate(45)">
      <!-- Fuselage -->
      <path d="M0 -14 C 2.2 -14, 3.4 -9, 3.4 -1 L 3.4 5.5 L 1.7 13 L -1.7 13 L -3.4 5.5 L -3.4 -1 C -3.4 -9, -2.2 -14, 0 -14 Z" fill="#C49A2B"/>
      <!-- Wings -->
      <path d="M-3 -1 L -14 6.5 L -14 9 L -3 5 L 3 5 L 14 9 L 14 6.5 L 3 -1 Z" fill="#C49A2B"/>
      <!-- Tail Stabilizers -->
      <path d="M-1.7 9 L -6.5 13.5 L -6.5 15 L -1.5 13.5 L 1.5 13.5 L 6.5 15 L 6.5 13.5 L 1.7 9 Z" fill="#C49A2B"/>
    </g>
  </g>
</svg>
