server.port=8085

# Spring Application Info
spring.application.name=Tashkent-Cargo-Queue

# Database: Embedded H2 with File Persistence in ./data/cargodb
spring.datasource.url=jdbc:h2:file:./data/cargodb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging / admin inspection at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.uz.airport.cargo=INFO
logging.level.org.springframework.web=INFO

# Terminal Configuration
airport.cargo.terminal.name=Toshkent Xalqaro Aeroporti - Yuk Terminali (TAS Cargo)
airport.cargo.terminal.waiting-time-limit-minutes=10
airport.cargo.terminal.max-calls-before-cancel=3
